name: Update & publish Radar IA
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7,12,17,22 * * *'
      timezone: 'America/Sao_Paulo'
permissions:
  contents: read
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Collect official sources
        if: github.event_name != 'push'
        run: npm run update-data
      - run: npm test
      - run: npm run build
      - name: Preserve the last collected edition for future fallbacks
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/initial-feed.json lib/initial-benchmarks.json lib/initial-pricing.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Radar IA sources'
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
